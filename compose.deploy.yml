services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-civic_intel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_USER: ${POSTGRES_USER:-civic}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - civic-postgres:/var/lib/postgresql/data

  migrate:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    restart: "no"

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      CIVIC_BOOTSTRAP_MODE: runtime
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    ports:
      - "127.0.0.1:${CIVIC_API_PORT:-8000}:8000"

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    depends_on:
      api:
        condition: service_healthy
    environment:
      CIVIC_API_URL: http://api:8000
    ports:
      - "127.0.0.1:${CIVIC_WEB_PORT:-3000}:3000"

volumes:
  civic-postgres:
