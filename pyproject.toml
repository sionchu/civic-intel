[project]
name = "civic-intel"
version = "0.1.0"
description = "Evidence-first public-official intelligence V0"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["mypy>=1.11,<2", "pytest>=8.3,<9", "ruff>=0.6,<1"]

[project.scripts]
civic-quality = "packages.verification.quality:main"
civic-stage-assembly = "workers.assembly_roster:main"
civic-stage-legislative = "workers.legislative_activity:main"
civic-stage-local-election = "workers.local_elections:main"

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["packages*", "workers*", "apps*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
