name: Temporary Public Beta Staging Preflight

on:
  push:
    branches:
      - ops/public-beta-preflight

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install -e .

      - name: Run read-only staging preflight
        run: |
          python -m workers.public_beta_preflight             --web-base-url https://web-staging-efe2.up.railway.app             --expect-indexing disabled             --person-id 44745d09-398c-46ce-bc38-81f0f606c1d7             --organization-id 3ef4de75-fa3f-5815-81f4-8bc5efdc33f1
