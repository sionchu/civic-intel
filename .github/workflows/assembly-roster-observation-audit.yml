name: Assembly Roster Observation Audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assembly-roster-observation-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: sqlite:///./assembly-roster-audit.db
      CIVIC_HTTP_USER_AGENT: CivicIntel/0.1 (+https://github.com/sionchu/civic-intel)

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Require Assembly API credential
        env:
          ASSEMBLY_API_KEY: ${{ secrets.ASSEMBLY_API_KEY }}
        run: |
          if [ -z "${ASSEMBLY_API_KEY:-}" ]; then
            echo "::error::Repository secret ASSEMBLY_API_KEY is not configured."
            exit 1
          fi

      - name: Prepare disposable database
        run: |
          rm -f assembly-roster-audit.db
          python -m alembic upgrade head

      - name: Observe the unfiltered roster
        env:
          ASSEMBLY_API_KEY: ${{ secrets.ASSEMBLY_API_KEY }}
        run: >-
          civic observe assembly
          --page-size 100
          --database-url "$DATABASE_URL"
          --allow-effect SOURCE_INGESTION
          > assembly-roster-run.json

      - name: Validate current observation coverage and write allowlisted report
        run: >-
          python -m packages.verification.assembly_roster_observation_audit
          --database-url "$DATABASE_URL"
          --receipt assembly-roster-run.json
          --output assembly-roster-coverage.json

      - name: Upload observation audit
        uses: actions/upload-artifact@v4
        with:
          name: assembly-roster-observation-audit
          path: |
            assembly-roster-run.json
            assembly-roster-coverage.json
          if-no-files-found: error
          retention-days: 7
