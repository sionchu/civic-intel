name: Verify

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: civic_intel
          POSTGRES_PASSWORD: civic
          POSTGRES_USER: civic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U civic -d civic_intel"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            .railway/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Install web dependencies
        run: npm ci --prefix apps/web

      - name: Install deployment specification dependencies
        run: npm ci --prefix .railway

      - name: Run canonical verification
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: make verify

      - name: Verify Alembic round trip
        env:
          DATABASE_URL: sqlite:///./ci-migration.db
        run: |
          rm -f ci-migration.db
          python -m alembic upgrade head
          python -m alembic downgrade -1
          python -m alembic upgrade head

      - name: Verify PostgreSQL migration, load and API contracts
        env:
          POSTGRES_TEST_URL: postgresql+psycopg://civic:civic@127.0.0.1:5432/civic_intel
        run: python -m pytest tests/test_postgresql_integration.py

      - name: Verify PostgreSQL backup and restore
        env:
          PGPASSWORD: civic
        run: |
          expected_people="$(psql --host 127.0.0.1 --username civic --dbname civic_intel --tuples-only --no-align --command "select count(*) from people")"
          expected_organization_claims="$(psql --host 127.0.0.1 --username civic --dbname civic_intel --tuples-only --no-align --command "select count(*) from claims where organization_id is not null and publication_status='PUBLISHED' and superseded_at is null")"
          expected_public_people="$(python -c "from packages.persistence import SqlAlchemyRepository; print(len(SqlAlchemyRepository('postgresql+psycopg://civic:civic@127.0.0.1:5432/civic_intel').public_people()))")"
          pg_dump --host 127.0.0.1 --username civic --dbname civic_intel --format custom --file /tmp/civic-intel.dump
          createdb --host 127.0.0.1 --username civic civic_intel_restore
          pg_restore --host 127.0.0.1 --username civic --dbname civic_intel_restore --exit-on-error /tmp/civic-intel.dump
          python -m packages.verification.postgresql \
            --database-url postgresql+psycopg://civic:civic@127.0.0.1:5432/civic_intel_restore \
            --expected-people "$expected_people" \
            --expected-public-people "$expected_public_people" \
            --expected-organization-claims "$expected_organization_claims"

      - name: Verify deployment artifacts
        env:
          DATABASE_URL: postgresql+psycopg://civic:civic@db:5432/civic_intel
          POSTGRES_PASSWORD: civic
        run: |
          docker build --file deploy/Dockerfile.api --tag civic-intel-api:verify .
          docker build --file deploy/Dockerfile.web --tag civic-intel-web:verify .
          docker compose --file compose.deploy.yml config --quiet
          npm run check --prefix .railway

      - name: Verify installed sync entrypoint outside source tree
        run: |
          docker run --rm --entrypoint /bin/sh civic-intel-api:verify -lc '
            set -eu
            cd /tmp
            test "$(command -v civic-sync)" = "/usr/local/bin/civic-sync"
            python -c "import importlib; module=importlib.import_module(\"packages.persistence.repository\"); assert \"site-packages\" in module.__file__; assert module._expected_schema_revision() == \"0007\""
            python -c "from alembic import command; from alembic.config import Config; config=Config(\"/app/alembic.ini\"); config.set_main_option(\"script_location\", \"/app/migrations\"); config.set_main_option(\"sqlalchemy.url\", \"sqlite:////tmp/runtime.db\"); command.upgrade(config, \"head\")"
            unset ASSEMBLY_API_KEY
            set +e
            civic-sync assembly-roster --database-url sqlite:////tmp/runtime.db >/tmp/civic-sync-receipt.json
            status=$?
            set -e
            test "$status" -eq 1
            python -c "import json; payload=json.load(open(\"/tmp/civic-sync-receipt.json\")); assert payload[\"error_reason\"][\"code\"] == \"MissingAssemblyApiKey\"; assert payload[\"error_reason\"][\"phase\"] == \"source_fetch_parse_or_coverage\"; assert payload[\"run_id\"] is not None; assert payload[\"committed_count\"] == 0; print(\"container-sync-entrypoint-regression=pass\")"
          '
