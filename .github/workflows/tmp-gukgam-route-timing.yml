name: Temporary Gukgam Route Timing Post-Fix

on:
  push:
    branches:
      - ops/public-beta-preflight

permissions:
  contents: read

jobs:
  timing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Measure public Web routes
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://web-staging-efe2.up.railway.app'
          for round in 1 2; do
            for path in /people /organizations /gukgam/2026; do
              printf 'ROUND=%s PATH=%s ' "$round" "$path"
              curl --silent --show-error --location --max-time 30                 --output /dev/null                 --write-out 'HTTP=%{http_code} TOTAL=%{time_total}\n'                 "$BASE$path"
            done
          done
