name: Temporary Gukgam Live Probe

on:
  push:
    branches:
      - work/gukgam-schedule-live-probe

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e .
      - name: Probe official National Assembly schedule API
        env:
          ASSEMBLY_API_KEY: sample
        run: |
          set -euo pipefail
          python -m workers.gukgam_schedule_probe \
            --date 2026-10-06 \
            --committee "과학기술정보방송통신위원회" \
            --page-size 10
